<!DOCTYPE html>
<html lang="en"></html>
<head>
    <script defer src="js/script.js"></script>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<title></title>
<meta>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Adriana Carballeda for the WEB-115 course at Wake Tech.</p>
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        document.write("This dashboard demostrate how JavaScript can be used to create interactive websites.")
    </script>
    
    <!--The <noscript> is for web browsers with JavaScript rendering disabled.--> 
    <noscript>
        Unfortunately, your web browser does not support JavaScript
    </noscript>

    <div class="container">
        <div class="row">
        <!-- Dashboard Content -->
            <div class="col" id="metric-converter">
                <h2>Imperial/Metric Converter</h2>

                <form id="metric-form">
                    <label for="input-value">Enter a numeric value:</label>
                    <input type="number" id="input-value" step="any" required>

                    <label for="conversion-type">Select a conversion:</label>
                    <select id="conversion-type">
                        <option value="1">Inches to centimeters</option>
                        <option value="2">Feet to centimeters</option>
                        <option value="3">Yards to meters</option>
                        <option value="4">Miles to kilometers</option>
                        <option value="5">Centimeters to inches</option>
                        <option value="6">Centimeters to feet</option>
                        <option value="7">Meters to yards</option>
                        <option value="8">Kilometers to miles</option>
                    </select>

                    <button type="submit" id="convert-button">Convert</button>
                </form>

                <p id="conversion-result"></p>

                <script defer src="js/metric-converter.js"></script>
            </div>
        </div>
    </div>
</body>
</html>
